{% extends 'base.html' %}
{% block body %}

<style>
  .contact-page {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bg-slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    z-index: 0;
  }
  .bg-slide.active {
    opacity: 1;
  }
  .bg-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(20, 20, 30, 0.55);
    z-index: 1;
  }

  .contact-card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(6px);
    border-radius: 16px;
    padding: 45px 40px;
    max-width: 480px;
    width: 90%;
    margin: 60px auto;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
  }
  .contact-card h1 {
    text-align: center;
    font-weight: 700;
    color: #222;
    margin-bottom: 8px;
  }
  .contact-card p.subtitle {
    text-align: center;
    color: #666;
    font-size: 0.9rem;
    margin-bottom: 30px;
  }
  .contact-card label {
    font-size: 0.85rem;
    color: #444;
    margin-bottom: 4px;
    display: block;
  }
  .contact-card .form-control {
    border-radius: 10px;
    border: 1px solid #ddd;
    padding: 10px 14px;
  }
  .contact-card .form-control:focus {
    border-color: #888;
    box-shadow: none;
  }
  .btn-submit-full {
    background-color: #222;
    color: #fff;
    border: none;
    border-radius: 25px;
    padding: 12px 0;
    width: 100%;
    font-size: 0.9rem;
    letter-spacing: 1px;
    margin-top: 10px;
  }
  .btn-submit-full:hover {
    background-color: #444;
    color: #fff;
  }
</style>

<div class="contact-page">
  <div class="bg-slide active" style="background-image:url('https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=1920&h=1080&fit=crop&q=80');"></div>
  <div class="bg-slide" style="background-image:url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=1920&h=1080&fit=crop&q=80');"></div>
  <div class="bg-slide" style="background-image:url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=1920&h=1080&fit=crop&q=80');"></div>
  <div class="bg-overlay"></div>

  <div class="contact-card">
    <h1>Contact Us</h1>
    <p class="subtitle">We'd love to hear from you. Send us a message below.</p>

    <form method="post" action="/contact">
        {% csrf_token %}
      {% csrf_token %}
      <div class="row mb-3">
        <div class="col-md-6 mb-3 mb-md-0">
          <label for="first_name">First Name</label>
          <input type="text" class="form-control" id="first_name" name="first_name">
        </div>
        <div class="col-md-6">
          <label for="last_name">Last Name</label>
          <input type="text" class="form-control" id="last_name" name="last_name">
        </div>
      </div>

      <div class="mb-3">
        <label for="email">Email *</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <div class="mb-3">
        <label for="message">Message</label>
        <textarea class="form-control" id="message" name="message" rows="4"></textarea>
      </div>

      <button type="submit" class="btn-submit-full">Submit</button>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const slides = document.querySelectorAll('.bg-slide');
    let current = 0;
    setInterval(function () {
      slides[current].classList.remove('active');
      current = (current + 1) % slides.length;
      slides[current].classList.add('active');
    }, 4000);
  });
</script>

{% endblock body %}
